name: Android Build

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  dev:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
            ndk;28.2.13676358

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint, and build dev APKs
        run: >-
          ./gradlew
          :shared:testDebugUnitTest
          :common:lintDebug
          :mobile:lintDebug
          :automotive:lintDebug
          :mobile:assembleDebug
          :automotive:assembleDebug
          --stacktrace

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
            ndk;28.2.13676358

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in RELEASE_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret for ${name}" >&2
              exit 1
            fi
          done

          keystore_path="${RUNNER_TEMP}/xcertplay-release.jks"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          keytool -list \
            -keystore "${keystore_path}" \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            -alias "${ANDROID_KEY_ALIAS}" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=${keystore_path}" >> "${GITHUB_ENV}"

      - name: Test, lint, and build signed release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew
          :shared:testDebugUnitTest
          :common:lintRelease
          :mobile:lintRelease
          :automotive:lintRelease
          :automotive:assembleRelease
          :mobile:assembleRelease
          --stacktrace

      - name: Verify and collect signed APKs
        run: |
          set -euo pipefail

          mkdir -p release
          safe_tag="${GITHUB_REF_NAME//\//-}"
          mobile_apk="$(find mobile/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          automotive_apk="$(find automotive/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "${mobile_apk}"
          test -n "${automotive_apk}"

          apksigner="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          "${apksigner}" verify --verbose --print-certs "${mobile_apk}"
          "${apksigner}" verify --verbose --print-certs "${automotive_apk}"

          cp "${mobile_apk}" "release/xcertplay-mobile-${safe_tag}.apk"
          cp "${automotive_apk}" "release/xcertplay-automotive-${safe_tag}.apk"

      - name: Upload APKs to the tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" release/*.apk --clobber
