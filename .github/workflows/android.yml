name: Android Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
            ndk;28.2.13676358

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint, and build APKs
        run: >-
          ./gradlew
          :shared:testDebugUnitTest
          :mobile:lintDebug
          :automotive:lintDebug
          :mobile:assembleDebug
          :mobile:assembleRelease
          :automotive:assembleDebug
          :automotive:assembleRelease
          --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: xcertplay-apks
          path: |
            mobile/build/outputs/apk/debug/*.apk
            mobile/build/outputs/apk/release/*.apk
            automotive/build/outputs/apk/debug/*.apk
            automotive/build/outputs/apk/release/*.apk
          if-no-files-found: error
